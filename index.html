<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>立体人生</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --inner-size: min(42vw, 160px);
    --outer-size: calc(var(--inner-size) * 1.8);
  }

  html, body {
    height: 100%;
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  body {
    background: radial-gradient(ellipse at 20% 10%, #fff0f6 0%, #ffd6e7 45%, #ee9dbd 100%);
    color: #5c2d43;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }

  #petals {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }

  .petal {
    position: absolute;
    top: -6vh;
    left: 0;
    width: 14px;
    height: 11px;
    border-radius: 150% 0 150% 0;
    background: linear-gradient(135deg, #ffd7e8, #ffaeca);
    opacity: 0;
    will-change: transform;
    animation: fall linear infinite;
  }

  .petal:nth-child(even) {
    border-radius: 0 150% 0 150%;
  }

  @keyframes fall {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg);
      opacity: 0;
    }
    8% {
      opacity: var(--petal-opacity, 0.85);
    }
    85% {
      opacity: var(--petal-opacity, 0.85);
    }
    100% {
      transform: translate3d(var(--sway, 20vw), 108vh, 0) rotate(var(--spin, 720deg));
      opacity: 0;
    }
  }

  .stage {
    position: fixed;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
    perspective: 1400px;
    perspective-origin: 50% 42%;
  }

  .scene {
    position: relative;
    width: var(--outer-size);
    height: var(--outer-size);
    transform-style: preserve-3d;
    cursor: grab;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
  }

  .scene:active {
    cursor: grabbing;
  }

  .cube {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-style: preserve-3d;
  }

  .cube.inner {
    width: var(--inner-size);
    height: var(--inner-size);
    margin-left: calc(var(--inner-size) / -2);
    margin-top: calc(var(--inner-size) / -2);
  }

  .cube.outer {
    width: var(--outer-size);
    height: var(--outer-size);
    margin-left: calc(var(--outer-size) / -2);
    margin-top: calc(var(--outer-size) / -2);
  }

  .face {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes cube-spin {
    0%   { transform: rotateX(0deg) rotateY(0deg); }
    25%  { transform: rotateX(90deg) rotateY(90deg); }
    50%  { transform: rotateX(180deg) rotateY(180deg); }
    75%  { transform: rotateX(270deg) rotateY(270deg); }
    100% { transform: rotateX(360deg) rotateY(360deg); }
  }

  .cube.outer {
    animation: cube-spin 20s linear infinite;
  }

  .cube.inner {
    visibility: hidden;
    animation: cube-spin 15s linear infinite reverse;
  }

  .scene.exploded .cube.inner {
    visibility: visible;
  }

  .side {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 10px;
    border: 2px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 12px 34px rgba(110, 35, 68, 0.32);
    background: #fff;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .side.back {
    transform: rotateY(180deg);
    visibility: hidden;
  }

  .scene.exploded .side.back {
    visibility: visible;
  }

  .side-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    filter: blur(16px) brightness(0.78) saturate(1.25);
    transform: scale(1.25);
  }

  .side-main {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }

  .caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 22px 6px 7px;
    font-size: 12px;
    text-align: center;
    color: #fff;
    text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
    background: linear-gradient(transparent, rgba(70, 20, 40, 0.72));
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    pointer-events: none;
  }

  .face.remote .caption {
    display: none;
  }

  .controls {
    position: fixed;
    left: 50%;
    bottom: 20px;
    z-index: 6;
    transform: translateX(-50%);
    background: rgba(255, 255, 255, 0.72);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-radius: 999px;
    padding: 7px 12px;
    box-shadow: 0 6px 20px rgba(130, 40, 80, 0.18);
    transition: opacity 0.35s ease;
  }

  .controls button {
    border: 0;
    background: rgba(255, 255, 255, 0.85);
    color: #7a2f50;
    font-size: 13px;
    padding: 7px 16px;
    cursor: pointer;
    border-radius: 999px;
    transition: background 0.2s;
  }

  .controls button:hover {
    background: #fff;
  }

  #musicBtn {
    position: fixed;
    right: 14px;
    top: 16px;
    z-index: 7;
    width: 44px;
    height: 44px;
    border: 0;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.78);
    color: #7a2f50;
    font-size: 20px;
    cursor: pointer;
    box-shadow: 0 6px 18px rgba(130, 40, 80, 0.2);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: opacity 0.35s ease;
  }

  .music-panel {
    position: fixed;
    right: 14px;
    top: 68px;
    z-index: 7;
    display: flex;
    flex-direction: column;
    gap: 8px;
    align-items: stretch;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 10px 26px rgba(120, 40, 75, 0.22);
    transition: opacity 0.35s ease;
  }

  .music-panel[hidden] {
    display: none;
  }

  .music-panel button {
    border: 0;
    background: #ffbcd4;
    color: #6f2847;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    white-space: nowrap;
  }

  .music-panel button:hover {
    background: #ffcfe0;
  }

  .music-panel label {
    font-size: 11px;
    color: #83405f;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .music-panel input[type="range"] {
    width: 120px;
    accent-color: #d96392;
  }

  .music-panel .music-status {
    font-size: 11px;
    color: #9a5f78;
    min-height: 14px;
    text-align: center;
  }

  body.ui-idle .controls,
  body.ui-idle #musicBtn,
  body.ui-idle .music-panel {
    opacity: 0;
    pointer-events: none;
  }

  @media (max-width: 520px) {
    .stage {
      perspective: 1000px;
    }

    .music-panel {
      right: 10px;
    }
  }
</style>
</head>
<body>

<div id="petals" aria-hidden="true"></div>

<button id="musicBtn" type="button" aria-label="音乐">♪</button>

<div class="music-panel" id="musicPanel" hidden>
  <button id="playPauseBtn" type="button">播放音乐</button>
  <label>
    音量
    <input id="volumeRange" type="range" min="0" max="1" step="0.05" value="0.7">
  </label>
  <div class="music-status" id="musicStatus">未加载</div>
</div>

<div class="stage">
  <div id="scene" class="scene" role="group" aria-label="双层 3D 立方体相册">
    <div id="innerCube" class="cube inner"></div>
    <div id="outerCube" class="cube outer"></div>
  </div>
</div>

<div class="controls">
  <button id="uploadBtn" type="button">上传图片</button>
  <button id="toggleBtn" type="button">拆散</button>
</div>
<input id="fileInput" type="file" accept="image/*" multiple hidden>

<audio id="audio" preload="metadata" loop></audio>

<script>
// ============================================================
// 默认占位图（当本地无图片时显示）
// 前 6 张贴内层，后 6 张贴外层
// ============================================================
const PHOTOS = [
  { caption: "春" }, { caption: "夏" }, { caption: "秋" }, { caption: "冬" },
  { caption: "和" }, { caption: "你" },
  { caption: "樱" }, { caption: "花" }, { caption: "未" }, { caption: "来" },
  { caption: "期" }, { caption: "待" }
];

// 音乐文件（请放置 bgm.mp3 或修改 URL）
const MUSIC_SRC = "bgm.mp3";

// 自动开合节奏
const BREATH_CLOSED_MS = 1600;
const BREATH_OPEN_MS = 1600;

// 无操作多久后隐藏界面按钮
const UI_HIDE_DELAY_MS = 3200;

// ===== 立方体面布局 =====
const FACE_LAYOUTS = [
  "rotateY(0deg)",
  "rotateY(180deg)",
  "rotateY(90deg)",
  "rotateY(-90deg)",
  "rotateX(90deg)",
  "rotateX(-90deg)"
];

// 占位 SVG（有编号和文字）
function placeholderSVG(label, index) {
  const hue = (index * 47 + 330) % 360;
  const c1 = "hsl(" + hue + ", 82%, 88%)";
  const c2 = "hsl(" + hue + ", 70%, 76%)";
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600">' +
    '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
    '<stop offset="0" stop-color="' + c1 + '"/>' +
    '<stop offset="1" stop-color="' + c2 + '"/>' +
    '</linearGradient></defs>' +
    '<rect width="600" height="600" fill="url(#g)"/>' +
    '<text x="50%" y="47%" fill="rgba(255,255,255,0.95)" font-size="150" font-family="sans-serif" text-anchor="middle" dominant-baseline="middle">' + (index + 1) + '</text>' +
    '<text x="50%" y="62%" fill="rgba(255,255,255,0.92)" font-size="36" font-family="sans-serif" text-anchor="middle">' + label + '</text>' +
    '</svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

const scene = document.getElementById("scene");
const innerCubeEl = document.getElementById("innerCube");
const outerCubeEl = document.getElementById("outerCube");
const allFaces = [];

// 创建立方体面（12个面）
PHOTOS.forEach(function (photo, index) {
  const face = document.createElement("div");
  face.className = "face";
  face.dataset.layer = index < 6 ? "inner" : "outer";
  face.dataset.layout = FACE_LAYOUTS[index % 6];

  const imgSrc = placeholderSVG(photo.caption, index);

  function makeSide(back) {
    const side = document.createElement("div");
    side.className = back ? "side back" : "side";

    const bg = document.createElement("img");
    bg.className = "side-bg";
    bg.alt = "";
    bg.draggable = false;
    bg.src = imgSrc;

    const main = document.createElement("img");
    main.className = "side-main";
    main.alt = photo.caption || "照片";
    main.draggable = false;
    main.src = imgSrc;

    const caption = document.createElement("div");
    caption.className = "caption";
    caption.textContent = back ? "🌸 " + photo.caption : photo.caption;

    side.appendChild(bg);
    side.appendChild(main);
    side.appendChild(caption);
    return side;
  }

  face.appendChild(makeSide(false));
  face.appendChild(makeSide(true));

  (index < 6 ? innerCubeEl : outerCubeEl).appendChild(face);
  allFaces.push(face);
});

const innerFaces = allFaces.filter(function (f) { return f.dataset.layer === "inner"; });
const outerFaces = allFaces.filter(function (f) { return f.dataset.layer === "outer"; });

// 设置各面的 translateZ
requestAnimationFrame(function () {
  const innerRadius = Math.round(innerFaces[0].offsetWidth / 2);
  const outerRadius = Math.round(outerFaces[0].offsetWidth / 2);

  allFaces.forEach(function (face) {
    const radius = face.dataset.layer === "inner" ? innerRadius : outerRadius;
    face.dataset.radius = String(radius);
    face.style.transform = face.dataset.layout + " translateZ(" + radius + "px)";
  });
});

// ========== 本地图片库（IndexedDB） ==========
const LOCAL_DB_NAME = "liti-local-photos";
const LOCAL_DB_VERSION = 1;
const LOCAL_STORE_NAME = "photos";
let localPhotoItems = [];
let localObjectUrls = [];

function openLocalDatabase() {
  return new Promise(function (resolve, reject) {
    const request = indexedDB.open(LOCAL_DB_NAME, LOCAL_DB_VERSION);
    request.onupgradeneeded = function () {
      const db = request.result;
      if (!db.objectStoreNames.contains(LOCAL_STORE_NAME)) {
        db.createObjectStore(LOCAL_STORE_NAME, { keyPath: "id", autoIncrement: true });
      }
    };
    request.onsuccess = function () { resolve(request.result); };
    request.onerror = function () { reject(request.error); };
  });
}

function saveFilesToLocal(files) {
  return openLocalDatabase().then(function (db) {
    return new Promise(function (resolve, reject) {
      const transaction = db.transaction(LOCAL_STORE_NAME, "readwrite");
      const store = transaction.objectStore(LOCAL_STORE_NAME);
      let saved = 0;

      Array.from(files).forEach(function (file) {
        if (!file.type || !file.type.startsWith("image/")) return;
        store.add({ name: file.name, type: file.type, blob: file, addedAt: Date.now() });
        saved++;
      });

      transaction.oncomplete = function () { resolve(saved); };
      transaction.onerror = function () { reject(transaction.error); };
      transaction.onabort = function () { reject(transaction.error); };
    });
  });
}

function loadLocalImages() {
  return openLocalDatabase().then(function (db) {
    return new Promise(function (resolve, reject) {
      const transaction = db.transaction(LOCAL_STORE_NAME, "readonly");
      const store = transaction.objectStore(LOCAL_STORE_NAME);
      const request = store.getAll();
      request.onsuccess = function () { resolve(request.result || []); };
      request.onerror = function () { reject(request.error); };
    });
  });
}

function releaseLocalObjectUrls() {
  localObjectUrls.forEach(function (url) { URL.revokeObjectURL(url); });
  localObjectUrls = [];
}

// 将一组图片应用到指定的面列表（按顺序循环填充）
function applyItemsToFaces(faces, items) {
  const count = faces.length;
  for (let i = 0; i < count; i++) {
    const item = items[i % items.length];
    const face = faces[i];
    face.classList.add("remote");
    face.querySelectorAll(".side-bg, .side-main").forEach(function (img) {
      img.onerror = null;
      img.src = item.url;
      if (img.classList.contains("side-main")) img.alt = item.name || "";
    });
    // 更新 caption（使用文件名或序号）
    const caption = face.querySelector(".caption");
    if (caption) {
      caption.textContent = item.name || "📷";
    }
  }
}

// 从本地库加载图片并应用到立方体
async function refreshLocalLibrary() {
  try {
    const records = await loadLocalImages();
    releaseLocalObjectUrls();

    // 按添加时间排序（最新的在前）
    records.sort(function (a, b) { return (a.addedAt || 0) - (b.addedAt || 0); });

    localPhotoItems = records.map(function (record) {
      return {
        id: record.id,
        name: record.name || "图片",
        url: URL.createObjectURL(record.blob)
      };
    });
    localObjectUrls = localPhotoItems.map(function (item) { return item.url; });

    if (localPhotoItems.length > 0) {
      // 内层和外层分别取图片，但这里我们简单用相同的列表（循环填充）
      // 如果希望内外层不同，可以切分，但用户要求所有面都显示上传图片，这里统一
      applyItemsToFaces(innerFaces, localPhotoItems);
      applyItemsToFaces(outerFaces, localPhotoItems);
    } else {
      // 无本地图片，恢复占位图
      allFaces.forEach(function (face, index) {
        const placeholder = placeholderSVG(PHOTOS[index % PHOTOS.length].caption, index);
        face.classList.remove("remote");
        face.querySelectorAll(".side-bg, .side-main").forEach(function (img) {
          img.src = placeholder;
        });
        const caption = face.querySelector(".caption");
        if (caption) {
          caption.textContent = PHOTOS[index % PHOTOS.length].caption;
        }
      });
    }
  } catch (e) {
    // 出错时保留占位图
  }
}

// 上传处理
async function initLocalPhotoLibrary() {
  const uploadBtn = document.getElementById("uploadBtn");
  const fileInput = document.getElementById("fileInput");

  uploadBtn.addEventListener("click", function () {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }
    fileInput.click();
  });

  fileInput.addEventListener("change", async function () {
    if (fileInput.files.length === 0) return;
    try {
      const saved = await saveFilesToLocal(fileInput.files);
      if (saved > 0) {
        await refreshLocalLibrary();
        uploadBtn.textContent = "已存 " + localPhotoItems.length + " 张";
        setTimeout(function () {
          uploadBtn.textContent = "上传图片";
        }, 2000);
      }
    } catch (e) {
      uploadBtn.textContent = "保存失败";
      setTimeout(function () {
        uploadBtn.textContent = "上传图片";
      }, 2000);
    }
    fileInput.value = "";
  });

  // 初始化加载已有图片
  await refreshLocalLibrary();
}

// ========== 四元数自由旋转 ==========
function axisAngle(ax, ay, az, angle) {
  const half = angle / 2;
  const s = Math.sin(half);
  return { w: Math.cos(half), x: ax * s, y: ay * s, z: az * s };
}

function multiplyQuat(a, b) {
  return {
    w: a.w * b.w - a.x * b.x - a.y * b.y - a.z * b.z,
    x: a.w * b.x + a.x * b.w + a.y * b.z - a.z * b.y,
    y: a.w * b.y - a.x * b.z + a.y * b.w + a.z * b.x,
    z: a.w * b.z + a.x * b.y - a.y * b.x + a.z * b.w
  };
}

function normalizeQuat(q) {
  const len = Math.sqrt(q.w * q.w + q.x * q.x + q.y * q.y + q.z * q.z);
  if (len === 0) return { w: 1, x: 0, y: 0, z: 0 };
  return { w: q.w / len, x: q.x / len, y: q.y / len, z: q.z / len };
}

function quatToMatrix3d(q) {
  q = normalizeQuat(q);
  const x = q.x, y = q.y, z = q.z, w = q.w;
  const x2 = x + x, y2 = y + y, z2 = z + z;
  const xx = x * x2, xy = x * y2, xz = x * z2;
  const yy = y * y2, yz = y * z2, zz = z * z2;
  const wx = w * x2, wy = w * y2, wz = w * z2;

  return "matrix3d(" +
    (1 - (yy + zz)) + "," + (xy + wz) + "," + (xz - wy) + ",0," +
    (xy - wz) + "," + (1 - (xx + zz)) + "," + (yz + wx) + ",0," +
    (xz + wy) + "," + (yz - wx) + "," + (1 - (xx + yy)) + ",0," +
    "0,0,0,1)";
}

const initial = multiplyQuat(
  axisAngle(0, 1, 0, -28 * Math.PI / 180),
  axisAngle(1, 0, 0, -18 * Math.PI / 180)
);
let rotation = normalizeQuat(initial);
let currentZoom = 1;

function renderRotation() {
  scene.style.transform = quatToMatrix3d(rotation) +
    " scale3d(" + currentZoom + "," + currentZoom + "," + currentZoom + ")";
}
renderRotation();

// 指针事件（拖拽旋转 + 双指缩放）
const activePointers = new Map();
let dragPointerId = null;
let lastX = 0, lastY = 0, moved = false;
let pinchStarted = false, pinchDistance = 0, pinchBaseZoom = 1, usedPinch = false;

function pointerDistance() {
  const values = Array.from(activePointers.values());
  if (values.length < 2) return 0;
  return Math.hypot(values[0].x - values[1].x, values[0].y - values[1].y);
}

function clampZoom(value) {
  return Math.max(0.45, Math.min(3.5, value));
}

function onPointerDown(event) {
  if (event.pointerType === "mouse" && event.button !== 0) return;
  if (event.pointerType === "touch" && event.cancelable) event.preventDefault();

  activePointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

  if (activePointers.size === 1) {
    dragPointerId = event.pointerId;
    lastX = event.clientX;
    lastY = event.clientY;
    moved = false;
    usedPinch = false;
    pinchStarted = false;
    scene.classList.add("dragging");
    try { scene.setPointerCapture(event.pointerId); } catch (e) {}
  } else {
    dragPointerId = null;
    scene.classList.remove("dragging");
    usedPinch = true;
    if (activePointers.size === 2) {
      pinchStarted = true;
      pinchDistance = pointerDistance();
      pinchBaseZoom = currentZoom;
    }
  }
}

function onPointerMove(event) {
  if (!activePointers.has(event.pointerId)) return;
  const point = activePointers.get(event.pointerId);
  point.x = event.clientX;
  point.y = event.clientY;

  if (activePointers.size >= 2) {
    if (pinchStarted) {
      const distance = pointerDistance();
      if (distance > 0 && pinchDistance > 0) {
        currentZoom = clampZoom(pinchBaseZoom * (distance / pinchDistance));
        renderRotation();
      }
    }
    return;
  }

  if (dragPointerId !== event.pointerId) return;
  const dx = event.clientX - lastX;
  const dy = event.clientY - lastY;
  if (Math.abs(dx) + Math.abs(dy) > 3) moved = true;
  lastX = event.clientX;
  lastY = event.clientY;

  const speed = 0.005;
  const deltaY = axisAngle(0, 1, 0, dx * speed);
  const deltaX = axisAngle(1, 0, 0, dy * speed);
  const delta = multiplyQuat(deltaY, deltaX);
  rotation = normalizeQuat(multiplyQuat(delta, rotation));
  renderRotation();
}

let lastTapTime = 0, lastTapX = 0, lastTapY = 0;
let suppressDblClickUntil = 0;

function onPointerEnd(event) {
  if (!activePointers.delete(event.pointerId)) return;

  if (activePointers.size === 0) {
    dragPointerId = null;
    scene.classList.remove("dragging");

    if (event.pointerType === "touch" && !usedPinch && !moved) {
      const now = performance.now();
      const tapMoved = Math.abs(event.clientX - lastTapX) + Math.abs(event.clientY - lastTapY);
      if (now - lastTapTime < 380 && tapMoved < 16) {
        toggleExplosion();
        lastTapTime = 0;
        suppressDblClickUntil = performance.now() + 600;
      } else {
        lastTapTime = now;
        lastTapX = event.clientX;
        lastTapY = event.clientY;
      }
    }
    usedPinch = false;
    pinchStarted = false;
    pinchDistance = 0;
    moved = false;
  } else if (activePointers.size === 1) {
    dragPointerId = null;
    scene.classList.remove("dragging");
  }
}

scene.addEventListener("pointerdown", onPointerDown);
scene.addEventListener("pointermove", onPointerMove);
scene.addEventListener("pointerup", onPointerEnd);
scene.addEventListener("pointercancel", onPointerEnd);
scene.addEventListener("lostpointercapture", function () {
  if (activePointers.size === 0) {
    dragPointerId = null;
    scene.classList.remove("dragging");
  }
});
scene.addEventListener("dblclick", function () {
  if (performance.now() < suppressDblClickUntil) return;
  toggleExplosion();
});

// ========== 拆散 / 复原 ==========
const toggleBtn = document.getElementById("toggleBtn");
let exploded = false;
let breathTimer = null;
let manualHoldUntil = 0;

function setFaceTransforms(explode) {
  scene.classList.toggle("exploded", explode);
  allFaces.forEach(function (face) {
    const radius = Number(face.dataset.radius || 100);
    const multiplier = explode ? (face.dataset.layer === "inner" ? 1.9 : 2.0) : 1;
    const target = Math.round(radius * multiplier);
    face.style.transform = face.dataset.layout + " translateZ(" + target + "px)";
  });
}

function applyExplosion(open) {
  exploded = open;
  setFaceTransforms(open);
  toggleBtn.textContent = open ? "复原" : "拆散";
}

function scheduleBreath() {
  clearTimeout(breathTimer);
  const holdMs = exploded ? BREATH_OPEN_MS : BREATH_CLOSED_MS;
  breathTimer = setTimeout(function () {
    if (document.hidden || performance.now() < manualHoldUntil) {
      scheduleBreath();
      return;
    }
    applyExplosion(!exploded);
  }, holdMs);
}

function toggleExplosion() {
  manualHoldUntil = performance.now() + 15000;
  applyExplosion(!exploded);
  scheduleBreath();
}

toggleBtn.addEventListener("click", toggleExplosion);
scheduleBreath();

// ========== 音乐播放器 ==========
const audio = document.getElementById("audio");
const musicBtn = document.getElementById("musicBtn");
const musicPanel = document.getElementById("musicPanel");
const playPauseBtn = document.getElementById("playPauseBtn");
const volumeRange = document.getElementById("volumeRange");
const musicStatus = document.getElementById("musicStatus");

audio.src = MUSIC_SRC;
audio.loop = true;
audio.volume = Number(volumeRange.value);
musicStatus.textContent = "点击页面自动播放";

function startMusic() {
  audio.play().then(function () {
    playPauseBtn.textContent = "暂停";
    musicStatus.textContent = "播放中";
  }).catch(function () {});
}

function onFirstUserGesture() {
  startMusic();
  document.removeEventListener("pointerdown", onFirstUserGesture, true);
  document.removeEventListener("touchstart", onFirstUserGesture, true);
  document.removeEventListener("keydown", onFirstUserGesture, true);
}
document.addEventListener("pointerdown", onFirstUserGesture, true);
document.addEventListener("touchstart", onFirstUserGesture, true);
document.addEventListener("keydown", onFirstUserGesture, true);

musicBtn.addEventListener("click", function () {
  musicPanel.hidden = !musicPanel.hidden;
});

playPauseBtn.addEventListener("click", function () {
  if (audio.paused) {
    audio.play().then(function () {
      playPauseBtn.textContent = "暂停";
      musicStatus.textContent = "播放中";
    }).catch(function () {
      musicStatus.textContent = "找不到音乐文件";
      playPauseBtn.textContent = "播放音乐";
    });
  } else {
    audio.pause();
    playPauseBtn.textContent = "播放音乐";
    musicStatus.textContent = "已暂停";
  }
});

volumeRange.addEventListener("input", function () {
  audio.volume = Number(volumeRange.value);
});

audio.addEventListener("error", function () {
  musicStatus.textContent = "请放置 bgm.mp3 或改 MUSIC_SRC";
});

// ========== 界面自动隐藏 ==========
function showControls() {
  document.body.classList.remove("ui-idle");
  clearTimeout(showControls._timer);
  showControls._timer = setTimeout(function () {
    document.body.classList.add("ui-idle");
  }, UI_HIDE_DELAY_MS);
}
document.body.classList.add("ui-idle");
document.addEventListener("pointerdown", showControls, true);
document.addEventListener("pointermove", showControls, { passive: true });
document.addEventListener("keydown", showControls, true);

// ========== 樱花飘落 ==========
const petalLayer = document.getElementById("petals");
const petalCount = Math.min(24, Math.max(12, Math.floor(window.innerWidth / 48)));

for (let i = 0; i < petalCount; i++) {
  const petal = document.createElement("div");
  petal.className = "petal";
  const size = 7 + Math.random() * 8;
  petal.style.width = size + "px";
  petal.style.height = (size * 0.8) + "px";
  petal.style.left = (Math.random() * 100) + "vw";
  petal.style.setProperty("--sway", (Math.random() * 34 - 12) + "vw");
  petal.style.setProperty("--spin", (Math.random() * 900 - 450) + "deg");
  petal.style.setProperty("--petal-opacity", (0.5 + Math.random() * 0.4).toFixed(2));
  petal.style.animationDuration = (8 + Math.random() * 10) + "s";
  petal.style.animationDelay = (-Math.random() * 18) + "s";
  petalLayer.appendChild(petal);
}

// 初始化本地图片库（加载已有图片）
initLocalPhotoLibrary();
</script>
